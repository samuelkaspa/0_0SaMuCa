    :root {

      --purple: #8b5cf6;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #31206b 0, transparent 34%),
        radial-gradient(circle at 85% 75%, #073b51 0, transparent 32%),
        var(--bg);
    }
    .glow {
      position: fixed; width: 340px; height: 340px; border-radius: 50%;
      filter: blur(90px); opacity: .24; pointer-events: none;
      animation: drift 9s ease-in-out infinite alternate;
    }
    .glow.one { background: var(--purple); top: -110px; left: -90px; }
    .glow.two { background: var(--cyan); right: -110px; bottom: -120px; animation-delay: -4s; }
    .stars {
      position: fixed; inset: 0; pointer-events: none; opacity: .45;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    main {
      position: relative; width: min(92vw, 460px); padding: 38px 26px;
      text-align: center; border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px; background: rgba(13, 16, 38, .72);
      box-shadow: 0 24px 90px rgba(0,0,0,.4);
      backdrop-filter: blur(18px);
      opacity: 0; transform: translateY(28px) scale(.96);
      animation: enter .9s cubic-bezier(.2,.8,.2,1) .15s forwards;
    }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 20px; display: grid; place-items: center;
      border-radius: 24px; font-size: 30px; font-weight: 900;
      background: linear-gradient(135deg, var(--purple), #2563eb 60%, var(--cyan));
      box-shadow: 0 0 38px rgba(139,92,246,.38);
      animation: float 3s ease-in-out infinite;
    }
    .eyebrow { color: var(--cyan); text-transform: uppercase; letter-spacing: .22em; font-size: 11px; font-weight: 800; }
    h1 { font-size: clamp(27px, 7vw, 38px); line-height: 1.08; margin: 10px 0 12px; letter-spacing: -.04em; }
    p { color: var(--muted); margin: 0 auto 28px; line-height: 1.55; font-size: 14px; }
    .links { display: grid; gap: 13px; }
    .link {
      position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 58px; padding: 15px 18px; border-radius: 16px;
      color: white; text-decoration: none; font-weight: 750; letter-spacing: .01em;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13);
      transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
      opacity: 0; transform: translateY(14px);
      animation: buttonIn .55s ease forwards;
    }
    .link:nth-child(1) { animation-delay: .65s; }
    .link:nth-child(2) { animation-delay: .82s; }
    .link:nth-child(3) { animation-delay: .99s; }
    .link:nth-child(4) { animation-delay: 1.16s; }
    .link:hover, .link:focus-visible {
      transform: translateY(-3px) scale(1.015); border-color: rgba(34,211,238,.65);
      background: rgba(139,92,246,.17); box-shadow: 0 10px 28px rgba(34,211,238,.12);
      outline: none;
    }
    .link .icon { width: 28px; font-size: 20px; }
    .link .arrow { position: absolute; right: 18px; color: #a5b4fc; transition: transform .2s ease; }
    .link:hover .arrow { transform: translateX(4px); }
    footer { color: #737d9e; font-size: 11px; margin-top: 25px; letter-spacing: .08em; }
    @keyframes enter { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes buttonIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(2deg); } }
    @keyframes drift { to { transform: translate(35px, 25px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
